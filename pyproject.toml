[project]
name = "Telegram_Restricted_Media_Downloader"
authors = [{name = "Gentlesprite", email = "Gentlesprites@outlook.com"}]
version = "2.0.0"
description = "Telegram downloader (TRMD): Supports resumable downloads and uploads. Bot supports commands/links for downloading, forwarding, listening, uploading, and upload-after-download of non-downloadable Telegram content via API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "kurigram==2.2.19",
    "pygments>=2.19.2",
    "pymediainfo==7.0.1",
    "pyreadline3>=3.5.4",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
    "rich==14.2.0",
    "pyaes>=1.6.1",
    "pysocks>=1.7.1",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0,<14.0",  # uvicorn 0.49.0 需要 legacy server 协议，websockets 14+ 已移除
    "httpx>=0.25.0",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
include = ["module*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "freezegun>=1.2.0",
    "datamodel-code-generator>=0.25.0",
]
build = [
    "nuitka>=2.0.0",
    "zstandard>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
