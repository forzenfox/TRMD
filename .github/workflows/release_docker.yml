name: Release Docker

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（例如: v1.2.3）'
        required: false
        default: 'latest'

jobs:
  # ============================================================
  # Job 1: 构建基础镜像（系统依赖 + Python 依赖）
  #         缓存命中时秒级完成，仅 requirements.txt 变更时慢
  # ============================================================
  base:
    name: Build base image
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 构建并推送基础镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/trmd-base:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  # ============================================================
  # Job 2: 构建运行时镜像（amd64 原生构建，无需 QEMU 模拟）
  # ============================================================
  build:
    name: Build runtime image
    runs-on: ubuntu-latest
    needs: base

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 构建并推送运行时镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/trmd-base
          tags: |
            ghcr.io/${{ github.repository_owner }}/trmd:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/trmd:latest
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
